syntax = "proto3";
package skyport;
option java_multiple_files = true;
option java_package = "com.skyport.proto";

service FlightService {
  rpc ListFlights (Empty) returns (FlightList);
  rpc GetFlight (FlightRequest) returns (Flight);
  rpc SearchFlights (SearchRequest) returns (FlightList);
  rpc FleetStats (Empty) returns (Stats);

  // server-streaming: one Telemetry message per second until the client cancels
  rpc StreamTelemetry (FlightRequest) returns (stream Telemetry);
  // server-streaming: every aircraft in one stream, one frame per second
  rpc StreamFleet (Empty) returns (stream Telemetry);
}

message Empty {}
message FlightRequest { string flight_number = 1; }
message SearchRequest {
  string origin = 1;        // IATA code or city, case-insensitive, optional
  string destination = 2;   // IATA code or city, case-insensitive, optional
}
message FlightList { repeated Flight flights = 1; }

message Flight {
  string flight_number = 1;
  string airline = 2;
  string origin = 3;
  string origin_city = 4;
  string destination = 5;
  string destination_city = 6;
  double origin_lat = 7;
  double origin_lon = 8;
  double dest_lat = 9;
  double dest_lon = 10;
  double base_price = 11;
  int32 duration_minutes = 12;
  string aircraft = 13;
  string gate = 14;
  int32 seats_available = 15;
  int32 on_time_percent = 16;
  double distance_km = 17;
}

message Telemetry {
  string flight_number = 1;
  double latitude = 2;
  double longitude = 3;
  int32 altitude_ft = 4;
  int32 speed_kts = 5;
  int32 heading_deg = 6;
  double progress = 7;
  string phase = 8;
  int32 eta_minutes = 9;
  int32 vertical_speed_fpm = 10;
  int32 outside_temp_c = 11;
  int32 wind_kts = 12;
  int32 fuel_percent = 13;
}

message Stats {
  int32 airborne = 1;
  int32 climbing = 2;
  int32 cruising = 3;
  int32 descending = 4;
  double avg_altitude_ft = 5;
  double avg_speed_kts = 6;
  int32 seats_available = 7;
  double avg_on_time_percent = 8;
}
